name: Require dev source

# Required status check on main: PRs into main must come from dev.
on:
  pull_request:
    branches: [main]

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Only dev can be merged into main (got '${{ github.head_ref }}')"
            exit 1
          fi
