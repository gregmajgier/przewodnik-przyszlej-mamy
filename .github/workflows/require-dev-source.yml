name: Require dev source

# Required status check on main: PRs into main must come from dev.
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Only dev can be merged into main (got '$HEAD_REF')"
            exit 1
          fi
