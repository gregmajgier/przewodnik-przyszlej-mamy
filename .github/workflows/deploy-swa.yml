name: Deploy static web apps

on:
  push:
    branches: [main]
    paths: [landing/**, frontend/**, .github/workflows/deploy-swa.yml]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [landing, frontend]
    concurrency: deploy-${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Build
        working-directory: ${{ matrix.app }}
        env:
          # landing -> adres aplikacji; aplikacja -> adres API (SWA nie proxy'uje /api do backendu)
          VITE_APP_URL: https://app.mrodzina.app
          VITE_API_URL: https://api.mrodzina.app
        run: |
          npm ci
          npm run build
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ matrix.app == 'landing' && secrets.SWA_TOKEN_LANDING || secrets.SWA_TOKEN_FRONTEND }}
          action: upload
          app_location: ${{ matrix.app }}/dist
          skip_app_build: true
          skip_api_build: true
